<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score 🏏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">🏏 Live Cricket Score</div>
            <div class="nav">
                <button class="nav-btn active" onclick="showSection('live')">🔴 Live</button>
                <button class="nav-btn" onclick="showSection('upcoming')">📅 Upcoming</button>
                <button class="nav-btn" onclick="showSection('completed')">✅ Completed</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Live Matches -->
            <section id="live" class="section active">
                <h2>🔴 Live Matches</h2>
                <div id="liveMatches" class="matches-container"></div>
            </section>

            <!-- Upcoming Matches -->
            <section id="upcoming" class="section">
                <h2>📅 Upcoming Matches</h2>
                <div id="upcomingMatches" class="matches-container"></div>
            </section>

            <!-- Completed Matches -->
            <section id="completed" class="section">
                <h2>✅ Completed Matches</h2>
                <div id="completedMatches" class="matches-container"></div>
            </section>
        </main>
    </div>

    <!-- Match Detail Modal -->
    <div id="matchModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="matchDetail"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
